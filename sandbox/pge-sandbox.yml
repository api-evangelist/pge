      Client Access Token) over mutual 2-way SSL.
not_available:
  anonymous_sandbox: false
  self_serve_test_key: false
  test_clock_or_time_simulation: not published
  qa_host: >-
    sharemydataqa.pge.com is named in PG&E release notes as the QA
    dataCustodianScopeSelectionScreenURI host but does not resolve publicly
