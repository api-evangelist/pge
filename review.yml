findings:
  summary: >-
    Pacific Gas and Electric is the United States counter-example that the
    energy study needs. The central claim under test is that a mandate is not an
    implementation; PG&E demonstrates the converse just as sharply — an
    implementation can exist without the mandate that would supposedly produce
    it. There is no US federal energy consumer data right. Green Button at
    national level is a voluntary NAESB/NIST standard that began, in PG&E's own
    words, as "a challenge by the White House to utility companies". What
    compelled PG&E was Californian and specific: Public Utilities Code section
    8380 from SB 1476 (2010), a CPUC-filed Customer Data Access Tariff (Sample
    Form 79-1186, effective 1 April 2023), Electric Rule 24 and Gas Rule 25 for
    demand response providers, and CPUC Decision 14-05-016 for aggregated data.
    That is a real obligation, but a state one, which is why the regime is
    recorded as `other` rather than green-button-voluntary — calling it
    voluntary would be false, and calling it none would be false too. The status
    is live-implemented and it was proved rather than accepted: a MuleSoft
    gateway at api.pge.com distinguishes real listeners from invented ones,
    returns RFC 6749 OAuth errors on the token endpoint, and returns "Invalid
    Certificate" on every ESPI resource path because production traffic requires
    mutual TLS with a commercially issued client certificate. Around that
    endpoint sits something no Ontario LDC and few US utilities have: a complete,
    anonymous, login-free developer contract — a supported-API table with verbs,
    token classes and function-block mappings, an OAuth/ESPI authorization
    guide, XSD schemas in two generations, a worked 278KB sample payload, Python
    and JavaScript SDKs with development guides, a SoapUI walkthrough, published
    rate limits and dated release notes. The gap is that none of it is an
    OpenAPI; PG&E's machine-readable contract is XSD and its reference is PDF,
    which is a 2013 developer experience shipped competently rather than a 2026
    one. And the openness stops at the documentation. Getting data requires a US
    EIN, CPUC standing, a public-CA X.509 certificate, tariff acceptance,
    ninety-day registration testing and PG&E approval, then a customer's
    consent. On the market side there is nothing: no open grid or system API at
    all, and the aggregated ZIP-code datasets sit behind an organisation form
    and a data-use agreement. Open contract, gated consumer data, absent market
    data — the American shape.
  apisListed: 2
  apisListedNote: >-
    Two APIs are listed, both real, both documented by PG&E, both probed live:
    the Share My Data ESPI resource API and the Share My Data OAuth 2.0
    authorization API. They are listed separately because PG&E documents them
    separately, they sit on different base paths (/GreenButtonConnect versus
    /datacustodian), they use different security (mutual TLS plus bearer versus
    OAuth grants with certificate on the token call), and PG&E's own reference
    explicitly notes that "OAuth URLs are not prefixed with
    https://api.pge.com/GreenButtonConnect". The Energy Data Request Program is
    NOT listed as an API because it is a web form serving ZIP files, not an API.
    Download-my-data style bill downloads from the customer account are not
    listed either.
  noFabrication: >-
    No endpoint, host, scope, function block or specification was invented.
    Every URL in this file carries the HTTP status observed on 2026-07-27. The
    endpoint inventory under documentedEndpoints was read out of PG&E's own
    published Supported-APIs.pdf and corroborated against endpoint URLs printed
    in the body of PG&E's third-party developer page — it is not the result of
    path guessing. Control probes were run first, and their results are recorded
    above, so that every non-404 response on api.pge.com is interpretable.
    Nothing was saved to openapi/ or schemas/ that was not fetched at HTTP 200,
    and the single OpenAPI document is labelled in its own info block as the
    Green Button Alliance's, not PG&E's.
  duplicateRepoNote: >-
    Three earlier api-evangelist repos cover the same organisation under
    different slugs — all/pg-and-e, all/pgande and all/pgande-corp. They were
    produced by the generic enrichment pipeline, not by this seam review, and
    all/pgande and all/pgande-corp carry empty apis[] arrays. This repo (pge) is
    the researched profile. The duplicates should be reconciled under the
    duplicate-provider-retirement procedure.

